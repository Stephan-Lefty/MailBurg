<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420"
     width="1200" height="420" role="img" aria-label="MailBurg Server Edition – E-Mails. Sicher bewahrt.">
  <title>MailBurg Server Edition – E-Mails. Sicher bewahrt.</title>
  <style>
    /* Die Grundfarben stehen als fill-Attribut an den Elementen selbst,
       nicht in Variablen. Das ist Absicht: CSS-Variablen werden von
       schlanken Renderern wie rsvg nicht ausgewertet, und GitHub entfernt
       Stilangaben aus eingebetteten SVG ganz. Ohne Auswertung fielen die
       Flächen auf Schwarz zurück. So wirkt der dunkle Modus, wo CSS
       unterstützt wird - und wo nicht, sieht es trotzdem richtig aus. */
    @media (prefers-color-scheme: dark) {
      .wort  { fill: #d6dde8; }
      .turm  { fill: #97a1ad; }
      .boden { fill: #97a1ad; }
      .unter { fill: #9aa5b3; }
      .scharte { fill: #5b6672; }
      .edition { fill: #ef9a9a; }
    }
  </style>

  <!-- Burg -->
  <g transform="translate(-45 -46) scale(1.02)">
    <path class="boden" fill="#3a4048" d="M56 446 C150 420 362 420 456 446 C362 428 150 428 56 446 Z"/>

    <!-- Dahinter: der hohe Turm mit Fahne. Der Mast ist grau wie das
         Mauerwerk, nur das Tuch trägt die Farbe. -->
    <path class="turm" fill="#3a4048" d="M250 55 h9 v120 h-9 Z"/>
    <path fill="#c62828" d="M259 66 C292 59 316 80 346 73 C336 97 306 112 259 107 Z"/>
    <path fill="#c62828" d="M180 148 h32 v20 h20 v-20 h45 v20 h20 v-20 h32 v24 l-12 36 v50 h-125 v-50 l-12 -36 Z"/>
    <path fill="#7a1414" d="M199 196 a8 8 0 0 1 16 0 v32 h-16 Z M247 190 a8 8 0 0 1 16 0 v38 h-16 Z M295 196 a8 8 0 0 1 16 0 v32 h-16 Z"/>

    <!-- Davor: eine durchgehende graue Front aus beiden Türmen und dem
         Mauerstück dazwischen. -->
    <path class="turm" fill="#3a4048" d="M150 256 h209 v177 h-209 Z"/>
    <path class="turm" fill="#3a4048" d="M89 220 h21 v12 h13 v-12 h24 v12 h13 v-12 h20 v213 h-91 Z"/>
    <path class="turm" fill="#3a4048" d="M329 220 h21 v12 h13 v-12 h23 v12 h13 v-12 h21 v213 h-91 Z"/>
    <path class="scharte" fill="#20262f" d="M124 302 a11 11 0 0 1 22 0 v62 h-22 Z"/>
    <path class="scharte" fill="#20262f" d="M364 302 a11 11 0 0 1 22 0 v62 h-22 Z"/>

    <!-- Das Tor bricht die graue Front auf und bringt die Farbe nach vorn -->
    <path fill="#c62828" d="M173 435 v-69 a81.5 83 0 0 1 163 0 v69 Z"/>
    <path fill="#ffffff" d="M200 338 h109 a10 10 0 0 1 10 10 v75 a10 10 0 0 1 -10 10 h-109 a10 10 0 0 1 -10 -10 v-75 a10 10 0 0 1 10 -10 Z"/>
    <path fill="none" stroke="#c62828" stroke-width="11"
          stroke-linecap="round" stroke-linejoin="round" d="M189 345 L254.5 406 L320 345"/>
  </g>

