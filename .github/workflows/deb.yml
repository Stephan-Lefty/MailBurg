# Baut das Debian-Paket und hängt es an das Release.
#
# **Warum nicht bei jedem Push.** Dasselbe Argument wie bei der
# Windows-Fassung: Wer das Paket braucht, ruft es – über die
# Actions-Oberfläche oder mit
#
#     gh workflow run deb.yml --ref main
#
# Bei diesem Weg landet es als Artefakt am Lauf, nicht an einem Release.
#
# **Der Bau ist nicht der Punkt, die Probe ist es.** Ein .deb entsteht
# aus jedem Verzeichnis; ob die angegebenen Abhängigkeiten existieren und
# ob MailBurg nach der Installation startet, zeigt sich erst, wenn man es
# wirklich installiert. Genau das tun die Schritte unten – auf einem
# System, das dem der Anwender entspricht, und nicht auf Manjaro, wo
# entwickelt wird.
name: Debian-Paket

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: mailburg.deb bauen und ausprobieren
    runs-on: ubuntu-latest

    # **In einem Debian-Container, nicht auf dem Ubuntu-Runner.** Der
    # erste Anlauf am 2026-09-09 lief auf ubuntu-latest und stellte
    # fest: ``apt-cache search pyside6`` liefert dort *nichts*. Ubuntu
    # 24.04 kennt PySide6 gar nicht als Paket, Debian 13 sehr wohl.
    #
    # Auf dem falschen System zu prüfen ist schlimmer als gar nicht zu
    # prüfen: Der Lauf wäre grün geworden, sobald man die Qt-Prüfung
    # weglässt – und das Paket auf dem Zielsystem trotzdem kaputt.
    # Debian 13 ist, was die Anwender haben (GuideOS baut darauf auf).
    container:
      image: debian:trixie

    steps:
      - name: Werkzeuge für den Container
        # Ein Debian-Abbild bringt weder git noch python3 mit.
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates git python3 dpkg-dev

      - uses: actions/checkout@v4

      - name: Bauen
        run: python3 werkzeuge/deb_bauen.py dist

      - name: Was steht drin?
        # Im Protokoll soll nachlesbar sein, was ausgeliefert wurde -
        # besonders die Abhängigkeiten. Wer später fragt, warum auf
        # seinem Rechner etwas fehlt, findet die Antwort hier.
        run: |
          dpkg-deb --info dist/*.deb
          echo "--- Inhalt ---"
          dpkg-deb --contents dist/*.deb | grep -vE "dist-packages/mailburg/.*/" | head -40

      - name: Wie heißt Qt hier?
        # **Die Paketnamen sind das einzig Wackelige an einem .deb.**
        # Sie stehen in werkzeuge/deb_bauen.py als Text, und ob sie in
        # der Distribution wirklich so heißen, weiß nur die
        # Distribution. Ein falscher Name unter Recommends fällt nicht
        # einmal auf: apt übergeht ihn wortlos, und der Anwender hat ein
        # MailBurg ohne Fenster.
        run: |
          apt-get update -qq
          echo "--- was es an PySide6 gibt ---"
          apt-cache search --names-only pyside6 | sort | head -30
          echo "--- gesuchtes Paket ---"
          apt-cache policy python3-pyside6.qtwidgets || true

      - name: Lässt es sich installieren?
        # **Der eigentliche Prüfschritt.** Hier zeigt sich, ob die
        # Paketnamen unter Depends und Recommends überhaupt existieren.
        # Sie sind aus der Debian-Paketliste abgeschrieben, und ein
        # Tippfehler darin fiele sonst erst dem Anwender auf - mit einer
        # Fehlermeldung von apt, die nach seinem Rechner aussieht.
        run: |
          apt-get update -qq
          apt-get install -y ./dist/*.deb
          echo "--- installierte Empfehlungen ---"
          dpkg -l python3-pyside6.qtwidgets python3-keyring 2>&1 | tail -4

      - name: Läuft die Kommandozeile?
        run: |
          ausgabe=$(mailburg --version)
          echo "$ausgabe"
          echo "$ausgabe" | grep -qE "MailBurg [0-9]+\.[0-9]+\.[0-9]+" || {
            echo "::error::Die installierte Fassung meldet keine Version."
            exit 1
          }

      - name: Findet sie ihre Bilder?
        # Der Fehler vom 2026-09-04 in anderer Gestalt: Die Grafiken
        # lagen vollständig da und wurden nicht gefunden, weil niemand
        # am richtigen Ort nachsah. In einem Paket liegen sie woanders
        # als im Quellbaum - das muss geprüft werden, nicht vermutet.
        run: |
          python3 - <<'PY'
          import sys
          from mailburg.bilder import finden
          fehlt = [n for n in ("server/icon-64.png", "icon-256.png")
                   if finden(n) is None]
          if fehlt:
              print(f"::error::Nicht gefunden: {fehlt}")
              sys.exit(1)
          print("Bilder gefunden.")
          PY

      - name: Startet die Oberfläche?
        # Ohne Bildschirm lässt sich kein Fenster öffnen - aber der
        # Import ist die Hürde, an der eine Paketierung scheitert: ein
        # fehlendes Qt-Modul, ein vergessenes Unterverzeichnis.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 - <<'PY'
          from PySide6.QtWidgets import QApplication
          from mailburg.ui.hauptfenster import Hauptfenster  # noqa: F401
          from mailburg.ui.assistent import Einrichtungsassistent  # noqa: F401
          app = QApplication([])
          print("Oberfläche lädt.")
          PY

      - name: Und läuft ein Archiv durch?
        # Anlegen, füllen, suchen, prüfen - mit dem installierten Paket,
        # nicht mit dem Quellbaum. Sonst belegt der Lauf nur, dass das
        # Repository funktioniert.
        run: |
          cd /tmp
          mailburg anlegen /tmp/Probe --modus privat
          python3 - <<'PY'
          import mailbox, email.message, email.utils
          from datetime import datetime, timezone
          box = mailbox.mbox("/tmp/probe.mbox", create=True)
          for i in range(5):
              m = email.message.EmailMessage()
              m["Subject"] = f"Schlussrechnung {i}"
              m["From"] = email.utils.formataddr(("Josef Müller", "m@beispiel.example"))
              m["To"] = "post@beispiel.example"
              m["Date"] = email.utils.format_datetime(
                  datetime(2025, 3, 14, tzinfo=timezone.utc))
              m.set_content(f"Inhalt {i} mit Umlauten: äöüß")
              box.add(m)
          box.flush()
          PY
          mailburg importieren /tmp/Probe /tmp/probe.mbox --konto Probe
          mailburg suchen /tmp/Probe betreff:rechnung | tee /tmp/treffer.txt
          grep -q "Schlussrechnung" /tmp/treffer.txt || {
            echo "::error::Die Suche findet nichts - der Index kommt nicht mit."
            exit 1
          }
          mailburg pruefen /tmp/Probe

      - name: Was lintian sagt
        # Nicht blockierend: lintian ist streng, und manche seiner
        # Regeln zielen auf Pakete in der Distribution, nicht auf ein
        # Paket zum Herunterladen. Im Protokoll soll es trotzdem stehen.
        continue-on-error: true
        run: |
          apt-get install -y -qq lintian
          lintian --no-tag-display-limit dist/*.deb || true

      - name: Prüfsumme
        run: |
          cd dist
          sha256sum *.deb | tee "$(ls *.deb).sha256"

      - name: Behalten
        uses: actions/upload-artifact@v4
        with:
          name: mailburg-deb
          path: dist/*

  # **Das Hochladen gehört auf den Runner, nicht in den Container.**
  # ``gh`` ist auf dem Ubuntu-Runner vorinstalliert; ein Debian-Abbild
  # bringt es nicht mit, und es dafür nachzuinstallieren hieße, dem
  # Prüflauf ein Fremdrepository unterzuschieben.
  anhaengen:
    name: Ans Release hängen
    needs: deb
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mailburg-deb
          path: dist

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/*.deb dist/*.sha256 --clobber \
            --repo "${{ github.repository }}"
