# Baut die Windows-Fassung als einzelne Datei.
#
# **Nur bei Releases und auf ausdrückliche Anforderung.** GitHub rechnet
# Windows-Minuten doppelt, und dieses Konto hat schon einmal an einem
# einzigen Arbeitstag sein Monatskontingent verbraucht (1.800 von 2.000).
# Ein Build je Push wäre der schnellste Weg dorthin zurück.
name: Windows-Fassung

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    name: MailBurg.exe bauen
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          # Mit allen Zusätzen: Die gepackte Fassung soll können, was
          # MailBurg kann - besonders den Schlüsselbund. Wer sich eine
          # fertige Datei herunterlädt, installiert nichts nach.
          pip install -e ".[oberflaeche,imap,anhaenge,packen]"
          pip install pyinstaller

      - name: Fassungsnummer erzeugen
        run: python werkzeuge/fassung_erzeugen.py werkzeuge/fassung.txt

      - name: Bauen
        run: pyinstaller --clean --noconfirm werkzeuge/mailburg.spec

      - name: Läuft sie überhaupt?
        # Der wichtigste Schritt. Eine .exe, die sich bauen lässt, aber
        # beim Start über ein fehlendes Modul stolpert, wäre schlimmer
        # als keine - sie fällt erst dem Anwender auf.
        run: |
          $ausgabe = & ".\dist\MailBurg.exe" --version 2>&1 | Out-String
          Write-Host $ausgabe
          if ($ausgabe -notmatch "MailBurg \d+\.\d+\.\d+") {
            Write-Error "Die gepackte Fassung meldet keine Version."
            exit 1
          }

      - name: Größe nennen
        # Damit im Protokoll steht, wie groß sie geworden ist - wächst
        # sie unbemerkt auf 300 MB, fällt das sonst erst beim Laden auf.
        run: |
          $mb = [math]::Round((Get-Item ".\dist\MailBurg.exe").Length / 1MB, 1)
          Write-Host "MailBurg.exe: $mb MB"
          if ($mb -gt 250) {
            Write-Warning "Ungewöhnlich groß - stimmen die Ausschlüsse noch?"
          }

      - name: Prüfsumme
        # Wer eine unsignierte Datei herunterlädt, soll wenigstens
        # nachrechnen können, dass sie unterwegs nicht verändert wurde.
        run: |
          $h = (Get-FileHash ".\dist\MailBurg.exe" -Algorithm SHA256).Hash
          Write-Host $h
          "$h  MailBurg.exe" | Out-File -Encoding ascii ".\dist\MailBurg.exe.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: MailBurg-Windows
          path: |
            dist/MailBurg.exe
            dist/MailBurg.exe.sha256

      - name: An das Release hängen
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MailBurg.exe
            dist/MailBurg.exe.sha256
