name: Tests

# Seit dem 26.08.2026 ist MailBurg öffentlich; Actions-Minuten kosten
# hier nichts mehr. Die Sparsamkeit bleibt trotzdem – sie stammt aus der
# Zeit davor, und ihr Grund gilt weiter:
#
# GitHub rundet *jeden einzelnen Job* auf volle Minuten auf und rechnet
# macOS zehnfach, Windows zweifach. Ein macOS-Job, der neun Sekunden
# läuft, zählt als zehn Minuten. Die erste Fassung startete bei jedem
# Push dreizehn Jobs auf drei Betriebssystemen: 53 abgerechnete Minuten
# für einen Durchlauf von unter einer Minute. An einem einzigen
# Arbeitstag summierte sich das auf 1.800 von 2.000 Minuten – das
# gesamte Monatskontingent.
#
# Was auch ohne Rechnung bleibt: Wartezeit und verbrannte Rechenzeit.
# Deshalb gilt weiterhin: Bei jedem Push läuft *ein* Job auf Linux. Die
# teuren Betriebssysteme kommen einmal die Woche dran, und wenn jemand
# sie ruft.

on:
  push:
    # An Text ändert sich durch einen Testlauf nichts.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
  schedule:
    # Montags um 4 Uhr der breite Durchgang über alle Systeme.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      breit:
        description: "Auch Windows und macOS prüfen"
        type: boolean
        default: false

# Wer dreimal hintereinander pusht, braucht nur die Antwort auf den letzten.
# Ohne das liefen gestern Läufe weiter, deren Ergebnis niemanden mehr
# interessierte – bezahlt wurden sie trotzdem.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Alles in einem Job. Nicht aus Ordnungsliebe, sondern wegen der Aufrundung:
  # fünf Jobs à fünfzehn Sekunden kosten fünf Minuten, einer à siebzig
  # Sekunden kostet zwei.
  linux:
    name: Linux (bei jedem Push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Syntax prüfen
        run: python -m compileall -q mailburg tests

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Testmails erzeugen
        run: |
          python - <<'PY'
          import mailbox, email.message, email.utils
          from datetime import datetime, timezone
          box = mailbox.mbox("probe.mbox", create=True)
          for i in range(50):
              m = email.message.EmailMessage()
              m["Subject"] = f"Schlussrechnung {i} für Grüße aus München"
              m["From"] = email.utils.formataddr(("Josef Müller", "mueller@beispiel.de"))
              m["To"] = "stephan@beispiel.de"
              m["Date"] = email.utils.format_datetime(
                  datetime(2025, (i % 12) + 1, 14, tzinfo=timezone.utc))
              m.set_content(f"Inhalt der Nachricht {i} mit Umlauten: äöüß")
              if i % 3 == 0:
                  m.add_attachment(b"%PDF-1.4", maintype="application",
                                   subtype="pdf", filename=f"beleg-{i}.pdf")
              box.add(m)
          box.flush(); box.close()
          PY

      - name: Archiv anlegen, füllen, prüfen
        run: |
          python -m mailburg anlegen archiv --modus geschaeftlich --recht de
          python -m mailburg importieren archiv probe.mbox --konto firma
          python -m mailburg info archiv
          python -m mailburg pruefen archiv

      - name: Suche muss treffen
        run: |
          set -e
          # Teilwort mitten im Kompositum – der Grund für den zweiten Index
          python -m mailburg suchen archiv betreff:rechnung | grep -q "Schlussrechnung"
          # Umlaut im Absender, und dasselbe ohne Umlaut
          python -m mailburg suchen archiv von:müller | grep -q "Schlussrechnung"
          python -m mailburg suchen archiv von:muller | grep -q "Schlussrechnung"
          python -m mailburg suchen archiv hat:anhang typ:pdf | grep -q "Treffern"
          echo "Suche in Ordnung"

      - name: Index wegwerfen und neu bauen
        run: |
          set -e
          vorher=$(python -m mailburg info archiv | grep "Mails:")
          rm -rf ~/.local/share/mailburg
          python -m mailburg neuaufbau archiv
          nachher=$(python -m mailburg info archiv | grep "Mails:")
          test "$vorher" = "$nachher"
          echo "Neuaufbau liefert denselben Stand: $nachher"

      - name: Manipulation muss auffallen
        run: |
          set -e
          python - <<'PY'
          import json, pathlib, hashlib
          seg = sorted(pathlib.Path("archiv/meta").glob("*.jsonl"))[0]
          zeilen = seg.read_text("utf-8").splitlines()
          e = json.loads(zeilen[2])
          e["subject"] = "Harmlose Nachricht"
          # Der Fälscher rechnet den Eigenhash mit – genau dagegen ist die
          # Verkettung da.
          e["self"] = hashlib.sha256(json.dumps(
              {k: v for k, v in e.items() if k != "self"}, sort_keys=True,
              separators=(",", ":"), ensure_ascii=False).encode()).hexdigest()
          zeilen[2] = json.dumps(e, sort_keys=True, separators=(",", ":"),
                                 ensure_ascii=False)
          seg.write_text("\n".join(zeilen) + "\n", encoding="utf-8")
          PY
          if python -m mailburg pruefen archiv; then
            echo "FEHLER: Die Fälschung blieb unbemerkt."
            exit 1
          fi
          echo "Die Fälschung wurde erkannt."

      # Zuletzt, weil das Einrichtungsskript ein eigenes venv baut. Ein
      # Skript, das niemand ausführt, ist so viel wert wie kein Skript.
      - name: Einrichten und wieder abbauen
        run: |
          set -e
          ./install.sh --ohne-pakete
          export PATH="$HOME/.local/bin:$PATH"
          mailburg --version
          mailburg anlegen "$HOME/Archiv" --modus privat
          mailburg info "$HOME/Archiv"
          ~/.local/share/mailburg/venv/bin/python -c "import keyring, pypdf, zstandard"
          ./install.sh --entfernen
          test -f "$HOME/Archiv/archive.json" || { echo "Das Archiv wurde mit abgeräumt!"; exit 1; }
          test ! -e "$HOME/.local/bin/mailburg" || { echo "Der Befehl liegt noch da."; exit 1; }
          echo "Abgebaut, Archiv unberührt."

  # Die Versionsgrenzen sind plattformunabhängig – 3.11 wegen StrEnum, 3.14
  # weil Zstandard dort in der Standardbibliothek steckt. Beides lässt sich
  # auf Linux prüfen, also wird es auf Linux geprüft.
  python-raender:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q mailburg tests
      - run: python -m unittest discover -s tests

  # Der teure Teil: macOS kostet das Zehnfache, Windows das Doppelte. Nur
  # montags, oder wenn jemand den Ablauf von Hand mit »breit« startet.
  fremde-systeme:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.breit)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Einrichten und wieder abbauen (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          ./install.sh --ohne-pakete
          export PATH="$HOME/.local/bin:$PATH"
          mailburg --version
          mailburg anlegen "$HOME/Archiv" --modus privat
          ~/.local/share/mailburg/venv/bin/python -c "import keyring, pypdf, zstandard"
          ./install.sh --entfernen
          test -f "$HOME/Archiv/archive.json" || { echo "Das Archiv wurde mit abgeräumt!"; exit 1; }

      - name: Einrichten und wieder abbauen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1
          $env:PATH = "$env:LOCALAPPDATA\MailBurg\bin;$env:PATH"
          mailburg --version
          mailburg anlegen "$env:USERPROFILE\Archiv" --modus privat
          & "$env:LOCALAPPDATA\MailBurg\venv\Scripts\python.exe" -c "import keyring, pypdf, zstandard"
          ./install.ps1 -Entfernen
          if (-not (Test-Path "$env:USERPROFILE\Archiv\archive.json")) {
            throw "Das Archiv wurde mit abgeräumt!"
          }
