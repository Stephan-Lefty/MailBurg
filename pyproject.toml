[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailburg"
# Die Fassung steht ausschließlich in mailburg/__init__.py. Sie hier zu
# wiederholen ging schief: pyproject.toml blieb bei 0.1.0 stehen,
# während das Programm längst 0.9.0 meldete - und pip installierte
# folglich eine Fassung, die es nicht mehr gab. Am 2026-08-27 beim
# ersten Windows-Lauf aufgefallen.
dynamic = ["version"]
description = "Archiv für E-Mail, an einem Ort Ihrer Wahl"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stephan Rösner" }]
keywords = ["email", "archive", "imap", "gobd", "dsgvo"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: German",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Topic :: Communications :: Email",
    "Topic :: System :: Archiving",
]

# Der Kern kommt ohne Fremdpakete aus. Das ist Absicht: Ein Archiv, das man
# in zwanzig Jahren noch öffnen können soll, darf nicht an einer Bibliothek
# hängen, die es dann nicht mehr gibt. Alles Weitere ist Kür und wird zur
# Laufzeit geprüft.
dependencies = []

[project.optional-dependencies]
# Postfächer abrufen. Ohne keyring läuft es auch, dann wird das Passwort
# bei jedem Abruf neu erfragt.
imap = ["keyring>=24"]

# Anhänge durchsuchbar machen. pypdf ist der Rückfall, wenn pdftotext aus
# poppler nicht auf dem Rechner ist - das ist der schnellere Weg.
# Ausdrücklich nicht PyMuPDF: AGPL, und das vertrüge sich nicht mit MIT.
anhaenge = ["pypdf>=4"]

# Bessere Packung. Ab Python 3.14 steckt Zstandard in der Standard-
# bibliothek, davor braucht es das Paket. Fehlt beides, wird LZMA benutzt.
packen = ["zstandard>=0.22"]

# Die grafische Oberfläche. Bewusst nicht im Kern: PySide6 sind über
# hundert Megabyte, und die Kommandozeile läuft ohne.
#
# **keyring gehört dazu.** Wer die Oberfläche installiert, richtet dort
# Postfächer ein - und bekam bis zum 2026-08-28 ein Programm, das
# abrufen kann, aber keine Passwörter merkt. Die Meldung dazu klang
# nach einem Mangel des Rechners, dabei fehlte nur ein Paket. Ein
# Assistent, der nach Passwörtern fragt und sie dann vergisst, ist
# schlimmer als einer, der gar nicht erst fragt.
oberflaeche = ["PySide6-Essentials>=6.6", "keyring>=24"]

# Der Serverbetrieb. Bisher nur der Tresor - die Weboberflaeche kommt
# noch dazu.
#
# **cryptography ist hier Pflicht, nicht Kuer.** Auf einem Server gibt es
# keinen Schluesselbund; ohne Verschluesselung laege das Postfachpasswort
# im Klartext neben der Konfiguration. Einen Rueckfall darauf gibt es
# nicht - eine Datei, die aussieht wie ein Tresor und keiner ist, waere
# schlimmer als eine klare Absage.
server = ["cryptography>=42", "starlette>=0.37", "uvicorn>=0.30"]

alles = ["mailburg[imap,anhaenge,packen,oberflaeche]"]

[project.urls]
Quelltext = "https://github.com/Stephan-Lefty/MailBurg"
# In Anführungszeichen, weil TOML in blanken Schlüsseln keine Umlaute erlaubt.
"Änderungsprotokoll" = "https://github.com/Stephan-Lefty/MailBurg/blob/main/CHANGELOG.md"
Fehler = "https://github.com/Stephan-Lefty/MailBurg/issues"

[project.scripts]
mailburg = "mailburg.__main__:main"

[project.gui-scripts]
mailburg-gui = "mailburg.ui.app:main"

[tool.setuptools.packages.find]
include = ["mailburg*"]

[tool.setuptools.dynamic]
version = {attr = "mailburg.__version__"}
